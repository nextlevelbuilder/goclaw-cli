name: Release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Configure beta release stream
        if: github.ref_name == 'dev'
        shell: bash
        run: |
          # dev publishes prereleases for the next minor after the latest stable tag.
          # Example: latest stable v0.5.0 => dev releases v0.6.0-beta.N.
          latest_stable="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          if [ -z "$latest_stable" ]; then
            major=0
            minor=1
          else
            version="${latest_stable#v}"
            IFS='.' read -r major minor patch <<< "$version"
            minor=$((minor + 1))
          fi
          printf '{\n  "maintainedVersion": "%s.%s-beta"\n}\n' "$major" "$minor" > .semrelrc
          cat .semrelrc
      - name: Capture existing release tags
        shell: bash
        run: git tag --list 'v[0-9]*' | sort > "$RUNNER_TEMP/release-tags-before.txt"
      - name: Install semantic-release
        run: |
          go install github.com/go-semantic-release/semantic-release/v2/cmd/semantic-release@v2.31.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - id: semrel
        name: Run semantic-release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(
            --hooks goreleaser
            --changelog CHANGELOG.md
            --prepend-changelog
            --allow-initial-development-versions
            --allow-no-changes
          )
          if [ "$GITHUB_REF_NAME" = "dev" ]; then
            args+=(--prerelease)
          fi

          semantic-release "${args[@]}"

          git fetch --tags origin
          git tag --list 'v[0-9]*' | sort > "$RUNNER_TEMP/release-tags-after.txt"
          new_tag="$(comm -13 "$RUNNER_TEMP/release-tags-before.txt" "$RUNNER_TEMP/release-tags-after.txt" | sort -V | tail -n1)"
          if [ -n "$new_tag" ]; then
            echo "version=${new_tag#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated changelog
        if: steps.semrel.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          test -s CHANGELOG.md
          gh release upload "v${RELEASE_VERSION}" CHANGELOG.md --clobber
